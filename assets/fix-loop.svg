<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="The one-change fix loop: bank baseline, write change record, make one change, re-run, diff the whole output, keep or revert">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="300" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="46" fill="#0f172a" font-size="22" font-weight="700">The fix loop in test-fix: one change, measured on the whole output</text>
    <g font-size="14">
      <rect x="40" y="80" width="170" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="125" y="112" fill="#0f172a" font-weight="700" text-anchor="middle">1  Bank baseline</text>
      <text x="125" y="138" fill="#475569" text-anchor="middle">copy output and</text>
      <text x="125" y="158" fill="#475569" text-anchor="middle">sample run</text>

      <rect x="240" y="80" width="190" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="335" y="112" fill="#0f172a" font-weight="700" text-anchor="middle">2  Change record</text>
      <text x="335" y="138" fill="#475569" text-anchor="middle">hypothesis, target rows,</text>
      <text x="335" y="158" fill="#475569" text-anchor="middle">rows it could break</text>

      <rect x="460" y="80" width="170" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="545" y="112" fill="#0f172a" font-weight="700" text-anchor="middle">3  One change</text>
      <text x="545" y="138" fill="#475569" text-anchor="middle">at the first stage</text>
      <text x="545" y="158" fill="#475569" text-anchor="middle">that went wrong</text>

      <rect x="660" y="80" width="190" height="104" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="755" y="112" fill="#0f172a" font-weight="700" text-anchor="middle">4  Re-run both sets</text>
      <text x="755" y="138" fill="#475569" text-anchor="middle">sample + full input;</text>
      <text x="755" y="158" fill="#475569" text-anchor="middle">cache keeps it cheap</text>

      <rect x="880" y="80" width="170" height="104" rx="12" fill="#fff7ed" stroke="#f97316"/>
      <text x="965" y="112" fill="#9a3412" font-weight="700" text-anchor="middle">5  rerun_diff.py</text>
      <text x="965" y="138" fill="#7c2d12" text-anchor="middle">fixed · broken ·</text>
      <text x="965" y="158" fill="#7c2d12" text-anchor="middle">churned · blast radius</text>

      <rect x="1080" y="70" width="160" height="52" rx="10" fill="#dcfce7" stroke="#22c55e"/>
      <text x="1160" y="94" fill="#166534" font-weight="700" text-anchor="middle">KEEP</text>
      <text x="1160" y="112" fill="#166534" font-size="12.5" text-anchor="middle">fixed &gt; 0, broken = 0</text>
      <rect x="1080" y="142" width="160" height="52" rx="10" fill="#fee2e2" stroke="#ef4444"/>
      <text x="1160" y="166" fill="#991b1b" font-weight="700" text-anchor="middle">REVERT</text>
      <text x="1160" y="184" fill="#991b1b" font-size="12.5" text-anchor="middle">broken ≥ 2 or &gt; fixed</text>
    </g>
    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a3)">
      <path d="M212 132H236"/><path d="M432 132H456"/><path d="M632 132H656"/><path d="M852 132H876"/>
      <path d="M1052 120L1076 100"/><path d="M1052 144L1076 164"/>
    </g>
    <path d="M1160 196V236H125V188" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#a3)"/>
    <text x="640" y="262" fill="#475569" font-size="14" text-anchor="middle">Repeat with the next error class. Stop when a change moves fewer rows than two unchanged runs do (the noise floor).</text>
  </g>
</svg>
