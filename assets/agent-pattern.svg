<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="The agent design the skills build: screen, gather evidence, model observes, code decides, explain with opened evidence, validate and write">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="470" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="48" fill="#0f172a" font-size="24" font-weight="700">The agent the skills build: the model describes, code decides</text>
    <text x="40" y="74" fill="#64748b" font-size="15">The pattern behind top-ranked Orchestrate entries. Every scored value comes from tested code; the model only reads and reports.</text>

    <!-- legend -->
    <rect x="900" y="94" width="16" height="16" rx="4" fill="#ecfeff" stroke="#0891b2"/>
    <text x="924" y="107" fill="#334155" font-size="13">plain code (deterministic)</text>
    <rect x="1090" y="94" width="16" height="16" rx="4" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="1114" y="107" fill="#334155" font-size="13">model call</text>

    <g font-size="13.5">
      <!-- 1 screen -->
      <rect x="40" y="130" width="180" height="170" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="58" y="160" fill="#0e7490" font-size="15" font-weight="700">1  Screen</text>
      <text x="58" y="188" fill="#164e63">empty, off-topic,</text>
      <text x="58" y="208" fill="#164e63">injection signals</text>
      <text x="58" y="228" fill="#164e63">handled without</text>
      <text x="58" y="248" fill="#164e63">the big model</text>

      <!-- 2 evidence -->
      <rect x="244" y="130" width="180" height="170" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="262" y="160" fill="#0e7490" font-size="15" font-weight="700">2  Gather evidence</text>
      <text x="262" y="188" fill="#164e63">search · read · grep</text>
      <text x="262" y="208" fill="#164e63">match by ids, hashes,</text>
      <text x="262" y="228" fill="#164e63">time windows; record</text>
      <text x="262" y="248" fill="#164e63">every id opened</text>

      <!-- 3 observe -->
      <rect x="448" y="130" width="180" height="170" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="466" y="160" fill="#6d28d9" font-size="15" font-weight="700">3  Observe</text>
      <text x="466" y="188" fill="#4c1d95">model reads text,</text>
      <text x="466" y="208" fill="#4c1d95">PDFs, images; returns</text>
      <text x="466" y="228" fill="#4c1d95">typed JSON: enums,</text>
      <text x="466" y="248" fill="#4c1d95">booleans, evidence id</text>
      <text x="466" y="276" fill="#7c3aed" font-size="12.5">schema-validated, 1 retry</text>

      <!-- 4 decide -->
      <rect x="652" y="130" width="180" height="170" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
      <text x="670" y="160" fill="#0e7490" font-size="15" font-weight="700">4  Decide</text>
      <text x="670" y="188" fill="#164e63">ordered rule table,</text>
      <text x="670" y="208" fill="#164e63">first match wins;</text>
      <text x="670" y="228" fill="#164e63">each rule declares</text>
      <text x="670" y="248" fill="#164e63">the fields it reads</text>

      <!-- 5 explain -->
      <rect x="856" y="130" width="180" height="170" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="874" y="160" fill="#0e7490" font-size="15" font-weight="700">5  Explain</text>
      <text x="874" y="188" fill="#164e63">justification from the</text>
      <text x="874" y="208" fill="#164e63">rule that fired; cites</text>
      <text x="874" y="228" fill="#164e63">only evidence ids that</text>
      <text x="874" y="248" fill="#164e63">were actually opened</text>

      <!-- 6 write -->
      <rect x="1060" y="130" width="180" height="170" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="1078" y="160" fill="#0e7490" font-size="15" font-weight="700">6  Validate, write</text>
      <text x="1078" y="188" fill="#164e63">row checked against</text>
      <text x="1078" y="208" fill="#164e63">the contract; whole</text>
      <text x="1078" y="228" fill="#164e63">file validated, then</text>
      <text x="1078" y="248" fill="#164e63">atomic rename</text>
    </g>

    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a2)">
      <path d="M222 215H240"/><path d="M426 215H444"/><path d="M630 215H648"/><path d="M834 215H852"/><path d="M1038 215H1056"/>
    </g>

    <!-- support stores -->
    <g font-size="13.5">
      <rect x="448" y="330" width="180" height="56" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-dasharray="5 4"/>
      <text x="538" y="354" fill="#5b21b6" font-weight="700" text-anchor="middle">cache by input hash</text>
      <text x="538" y="374" fill="#6d28d9" text-anchor="middle">same input → same output</text>
      <path d="M538 302V326" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-start="url(#a2)" marker-end="url(#a2)"/>

      <rect x="244" y="330" width="180" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
      <text x="334" y="354" fill="#334155" font-weight="700" text-anchor="middle">usage.jsonl</text>
      <text x="334" y="374" fill="#475569" text-anchor="middle">→ usage_report.md</text>
      <path d="M446 358H428" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a2)"/>

      <rect x="856" y="330" width="384" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
      <text x="1048" y="354" fill="#334155" font-weight="700" text-anchor="middle">checkpoint per row: rule id, evidence ids, error</text>
      <text x="1048" y="374" fill="#475569" text-anchor="middle">crash → resume · wrong row → trace · evaluation report</text>
    </g>

    <rect x="40" y="406" width="1200" height="44" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="60" y="434" fill="#991b1b" font-size="14.5"><tspan font-weight="700">Why it scores:</tspan> injected text can at most bend one observation; it never reaches a rule that does not read text. Re-runs are free and identical, and every value traces to a rule.</text>
  </g>
</svg>
